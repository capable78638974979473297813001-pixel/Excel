<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LocalSpit — what to order, from your neighbors</title>
  <meta name="description" content="A no-ads, no-stars neighborhood food map. Real neighbors say what to get, what to skip, and what it really costs.">
  <meta name="theme-color" content="#1c1917">
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8590c'/%3E%3Cpath d='M32 12a14 14 0 0 0-14 14c0 11 14 26 14 26s14-15 14-26A14 14 0 0 0 32 12zm0 19a5 5 0 1 1 0-10 5 5 0 0 1 0 10z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map" aria-label="Map of nearby food spots"></div>

  <header id="top">
    <div class="bar">
      <h1 class="brand">Local<span>Spit</span></h1>
      <input id="search" type="search" placeholder="Find a dish or a spot" aria-label="Search dishes or spots" autocomplete="off">
      <button id="btn-lists" class="icon-btn" aria-label="Local lists" title="Local lists">☰</button>
      <button id="btn-support" class="icon-btn" aria-label="Support LocalSpit" title="Support LocalSpit">♥</button>
    </div>
    <div class="filters">
      <div id="skip-seg" class="seg" role="group" aria-label="Skip It filter">
        <button data-mode="all" aria-pressed="true">All</button>
        <button data-mode="hide" aria-pressed="false">Hide Skips</button>
        <button data-mode="only" aria-pressed="false">Only Skips</button>
      </div>
      <div id="vibe-chips" class="chips" aria-label="Vibe filters"></div>
    </div>
  </header>

  <div id="banner" hidden></div>

  <div id="fabs">
    <button id="btn-locate" class="fab" aria-label="Center on me" title="Center on me">◎</button>
    <button id="btn-add" class="fab fab-primary" aria-label="Add a spot or review" title="Add a spot">＋</button>
  </div>

  <section id="sheet" aria-live="polite"></section>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
